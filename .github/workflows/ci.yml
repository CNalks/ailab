name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts benchmarks
      - run: uv run ruff format --check src tests scripts benchmarks
      - run: uv run pytest
      - name: Demo end to end (offline fixture)
        run: uv run ailab demo --out out && test -s out/manifest.json
  site:
    # static showcase (site/): regenerate the data with the real pipeline, then type-check and build the Astro site
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --frozen
      - run: uv run python scripts/build_showcase_data.py
      - name: Fetch the shared design tokens over https (lockfile records git+ssh)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Static output has the three languages and the data
        run: |
          test -s site/dist/index.html && test -s site/dist/en/index.html && test -s site/dist/fr/index.html
          test -s site/dist/data/manifest.json && test -s site/dist/data/series/us_ilinet_wili.json
  e2e:
    # black-box API tests against a real `ailab serve` process (about 1.5 min)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: make e2e
  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: docker build -t ailab:ci .
      - name: Smoke test (/health, non-root)
        run: |
          docker run -d --name ailab -p 8000:8000 ailab:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/health | grep '"status":"ok"'
          curl -fs localhost:8000/ready | grep '"status":"ready"'
          curl -fs localhost:8000/docs -o /dev/null
          test "$(docker exec ailab id -u)" != "0"
          curl -fs "localhost:8000/api/v1/series/us_ilinet_wili/policy"
          docker ps --filter name=ailab --format '{{.Status}}'
      - name: Batch demo inside the container (read-only root fs)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL -v "$PWD/out:/out" ailab:ci demo --out /out
          test -s out/manifest.json
      - name: API e2e against the container (read-only fs, non-root, volumes, restart)
        run: |
          uv sync --frozen
          docker rm -f ailab >/dev/null 2>&1 || true
          AILAB_E2E_TARGET=container AILAB_E2E_ENGINE=docker AILAB_E2E_IMAGE=ailab:ci \
            uv run pytest tests/e2e -m e2e -p no:cacheprovider
      - name: Image size
        run: docker image inspect ailab:ci --format '{{.Size}} bytes'
